<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin | Vinexy Cre8tive Studios</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
body{font-size:15px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}.bar>div{min-width:150px}
table.ot{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line)}
table.ot th,table.ot td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:.9rem;white-space:nowrap}table.ot th{background:var(--cocoa);color:var(--cream)}
table.ot tr.row{cursor:pointer}table.ot tr.row:hover{background:#FFF7DA}.sc{overflow-x:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}.stats b{display:block;font-family:Syne,sans-serif;font-size:1.3rem}
.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{font:inherit}.mono{font-family:ui-monospace,monospace;font-size:.85rem}
.det{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:900px){.det{grid-template-columns:1fr}}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}.imgs a{display:block}.imgs img{width:100%;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.dot{display:inline-block;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);margin-right:4px;vertical-align:middle}
.ev{font-size:.82rem;color:var(--muted)}.ev.bad{color:var(--bad)}
</style>
</head>
<body>
<header class="top"><div class="wrap"><img src="assets/logo.png" alt="Vinexy Cre8tive Studios"><nav><span id="who"></span><button class="btn sm ghost" id="out" hidden style="color:var(--cream)">Sign out</button></nav></div></header>
<main class="wrap" style="padding:26px 20px 70px" id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>
</body>
</html>
